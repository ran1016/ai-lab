{% extends "base.html" %}
{% block title %}登录 · 后台{% endblock %}
{% block content %}
<section class="auth">
  <h1>管理员登录</h1>
  <form method="post" class="form">
    <label>用户名<input type="text" name="username" required autofocus></label>
    <label>密码<input type="password" name="password" required></label>
    <button type="submit">登录</button>
  </form>
  <p class="hint">默认账号 <code>admin</code> / <code>admin123</code>（请在 <code>.env</code> 中修改）</p>
</section>
{% endblock %}
